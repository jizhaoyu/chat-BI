name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify fast suite
        run: mvn --batch-mode --no-transfer-progress -DskipITs verify

  container-acceptance:
    runs-on: ubuntu-latest
    env:
      PLATFORM_DB_PASSWORD: ci-platform-app-password
      PLATFORM_DB_ROOT_PASSWORD: ci-platform-root-password
      SAMPLE_DB_PASSWORD: ci-sample-reader-password
      SAMPLE_DB_ROOT_PASSWORD: ci-sample-root-password
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate shipped Compose configuration
        run: docker compose config --quiet
      - name: Start shipped Compose environment
        run: |
          docker compose up -d --wait
      - name: Verify sample reader can query
        run: |
          docker exec -e MYSQL_PWD="$SAMPLE_DB_PASSWORD" chatbi-sample-sales-mysql \
            mysql --protocol=TCP -h127.0.0.1 -uchatbi_reader -Dsample_sales -e "SELECT COUNT(*) FROM fact_order"
      - name: Verify sample reader cannot write
        run: |
          if docker exec -e MYSQL_PWD="$SAMPLE_DB_PASSWORD" chatbi-sample-sales-mysql \
            mysql --protocol=TCP -h127.0.0.1 -uchatbi_reader -Dsample_sales -e "INSERT INTO dim_region VALUES (99, 'X', 'X', 'X')"; then
            echo "read-only account unexpectedly accepted a write" >&2
            exit 1
          fi
      - name: Verify unit and container suites
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Annotate failed test reports
        if: failure()
        shell: bash
        run: |
          shopt -s globstar nullglob
          reports=(**/target/surefire-reports/*.txt **/target/failsafe-reports/*.txt)
          for report in "${reports[@]}"; do
            if grep -Eq 'Failures: [1-9]|Errors: [1-9]' "$report"; then
              summary=$(tail -n 80 "$report" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
              echo "::error file=$report,title=Failed test report::$summary"
            fi
          done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
      - name: Dump Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --timestamps
      - name: Stop shipped Compose environment
        if: always()
        run: docker compose down --volumes
