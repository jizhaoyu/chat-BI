name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify fast suite
        run: mvn --batch-mode --no-transfer-progress -DskipITs verify

  container-acceptance:
    runs-on: ubuntu-latest
    env:
      PLATFORM_DB_PASSWORD: ci-platform-app-password
      PLATFORM_DB_ROOT_PASSWORD: ci-platform-root-password
      SAMPLE_DB_PASSWORD: ci-sample-reader-password
      SAMPLE_DB_ROOT_PASSWORD: ci-sample-root-password
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate and start shipped Compose environment
        run: |
          docker compose config --quiet
          docker compose up -d --wait
          docker exec -e MYSQL_PWD="$SAMPLE_DB_PASSWORD" chatbi-sample-sales-mysql \
            mysql -uchatbi_reader -Dsample_sales -e "SELECT COUNT(*) FROM fact_order"
          if docker exec -e MYSQL_PWD="$SAMPLE_DB_PASSWORD" chatbi-sample-sales-mysql \
            mysql -uchatbi_reader -Dsample_sales -e "INSERT INTO dim_region VALUES (99, 'X', 'X', 'X')"; then
            echo "read-only account unexpectedly accepted a write" >&2
            exit 1
          fi
      - name: Verify unit and container suites
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: error
      - name: Stop shipped Compose environment
        if: always()
        run: docker compose down --volumes
