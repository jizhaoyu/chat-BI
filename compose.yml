services:
  platform-mysql:
    image: mysql:8.4.7
    container_name: chatbi-platform-mysql
    environment:
      MYSQL_DATABASE: chatbi_platform
      MYSQL_USER: chatbi_app
      MYSQL_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${PLATFORM_DB_ROOT_PASSWORD:?PLATFORM_DB_ROOT_PASSWORD must be set}
    ports: ["3307:3306"]
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -u"$${MYSQL_USER}" -D"$${MYSQL_DATABASE}" -Nse "SELECT 1" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["platform-data:/var/lib/mysql"]

  sample-sales-mysql:
    image: mysql:8.4.7
    container_name: chatbi-sample-sales-mysql
    environment:
      MYSQL_DATABASE: sample_sales
      MYSQL_ROOT_PASSWORD: ${SAMPLE_DB_ROOT_PASSWORD:?SAMPLE_DB_ROOT_PASSWORD must be set}
      SAMPLE_READER_PASSWORD: ${SAMPLE_DB_PASSWORD:?SAMPLE_DB_PASSWORD must be set}
    ports: ["3308:3306"]
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${SAMPLE_READER_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -uchatbi_reader -Dsample_sales -Nse "SELECT 1 FROM fact_order LIMIT 1" >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sample-sales-data:/var/lib/mysql
      - ./docker/sample-sales/init:/docker-entrypoint-initdb.d:ro

volumes:
  platform-data:
  sample-sales-data:
